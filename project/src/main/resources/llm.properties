# 阿里云百炼（DashScope）- 通义千问 Qwen（OpenAI 兼容模式）
# 控制台：https://bailian.console.aliyun.com/
# API Key 在百炼控制台「API-KEY 管理」创建

llm.enabled=true
llm.provider=dashscope

# 中国内地（北京）默认端点；新加坡请改为：
# https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions
llm.api.url=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions

# 填入百炼 API Key（sk- 开头），或通过环境变量 DASHSCOPE_API_KEY / LLM_API_KEY 设置
llm.api.key=

# 常用模型：qwen-turbo（快）、qwen-plus（推荐）、qwen-max（最强）
llm.model=qwen-plus

llm.temperature=0.2
llm.timeout.seconds=90
